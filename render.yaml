services:
  # Backend API Service
  - type: web
    name: tbims-backend
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        sync: false
      - key: AUTH_TOKEN_SECRET
        generateValue: true
      - key: AUTH_USERS
        sync: false
      - key: CORS_ORIGIN
        sync: false

  # Frontend Static Application
  - type: web
    name: tbims-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    plan: free
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: tbims-backend
          property: host
